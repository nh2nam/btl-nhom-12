name: Java CI with Maven

# Luồng này sẽ tự động kích hoạt khi có code đẩy lên nhánh 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Chạy trên máy chủ Ubuntu ảo
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo code từ kho của bạn về máy chủ
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Bước 3: Chạy lệnh test tự động
      - name: Run JUnit Tests
        run: mvn clean test