name: CI/CD

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test and package
        run: mvn -B clean verify -Djavafx.platform=linux

      - name: Upload server artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auction-server-jar
          path: |
            dev/auction_server/target/auction-server.jar
            dev/auction_server/target/OnlineAuctionSystem-*.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Upload client artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auction-client-jar
          path: dev/auction_client/target/*.jar
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy (artifacts)
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download server JAR
        uses: actions/download-artifact@v4
        with:
          name: auction-server-jar
          path: dist/server

      - name: Download client JAR
        uses: actions/download-artifact@v4
        with:
          name: auction-client-jar
          path: dist/client

      - name: Publish build bundle
        uses: actions/upload-artifact@v4
        with:
          name: auction-release-${{ github.sha }}
          path: dist/
          retention-days: 30
